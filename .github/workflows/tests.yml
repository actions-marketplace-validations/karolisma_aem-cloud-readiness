name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scan the fixture
        run: python skills/aem-cloud-readiness/scripts/scan.py tests/fixtures/legacy-65-project

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report only
        id: report
        uses: ./
        with:
          path: tests/fixtures/legacy-65-project
      - name: Fail on the deadline rules
        id: deadline
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/legacy-65-project
          rules: deprecated-apis
          fail-on: deadline
      - name: Check the results
        env:
          CANDIDATES: ${{ steps.report.outputs.candidates }}
          FAILING: ${{ steps.deadline.outputs.failing }}
          OUTCOME: ${{ steps.deadline.outcome }}
        run: |
          echo "candidates=$CANDIDATES failing=$FAILING outcome=$OUTCOME"
          test "$CANDIDATES" = "37"
          test "$FAILING" = "2"
          test "$OUTCOME" = "failure"
